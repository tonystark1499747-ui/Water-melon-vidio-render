name: Render Remotion Video

on:
  workflow_dispatch: # Lets you trigger the render manually with a button

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render Video
        run: npm run render

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-apple-video
          path: out/ # Note: Change this if your video outputs to a different folder
